<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">首页</a>
      {% for col in site.columns %}
      <a href="{{ '/' | append: col.slug | append: '/' | relative_url }}">{{ col.title }}</a>
      {% endfor %}
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} · 本站内容为本人自述，不构成任何授权；llms.txt 与 robots.txt 不构成访问许可（docs/02 F4）。</p>
  </footer>
</body>
</html>
